name: Deploy LibreChat

on:
  push:
    branches:
      - master

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Trigger CodeBuild
        run: |
          BUILD_ID=$(aws codebuild start-build --project-name apogee-platform --query 'build.id' --output text)
          echo "Started build: $BUILD_ID"
          echo "View at: https://us-east-1.console.aws.amazon.com/codesuite/codebuild/projects/apogee-platform/build/${BUILD_ID}"
