# Development Docker Compose for standalone LibreChat development
# For integrated development with apogee-platform, use the main docker-compose.yml there

services:
  librechat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/librechat
      - BEDROCK_AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - BEDROCK_AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MCP_GATEWAY_URL=${MCP_GATEWAY_URL:-https://mcp.apog.ai}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      - ALLOW_REGISTRATION=true
      - DOMAIN_CLIENT=http://localhost:3080
      - DOMAIN_SERVER=http://localhost:3080
      - APOGEE_TEST_LOGIN_SECRET=local-test-secret
    volumes:
      - ../config/apogee/librechat.yaml:/app/librechat.yaml:ro
      - ../config/apogee/branding:/app/client/public/images/branding:ro
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
