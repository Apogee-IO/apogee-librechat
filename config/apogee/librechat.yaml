version: 1.2.1

# Apogee Platform Configuration for LibreChat
# Connect to MCP gateway for all tools

# Web Search Configuration - Self-hosted stack
# SearXNG for search, Firecrawl for scraping, Jina-compatible reranker
webSearch:
  # Search provider
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_URL}"
  safeSearch: 1
  # Scraper (extracts full page content)
  scraperProvider: "firecrawl"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  scraperTimeout: 7500
  # Reranker (improves relevance)
  rerankerProvider: "jina"
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"

endpoints:
  bedrock:
    # Use inference profile IDs (us.anthropic.*) for cross-region inference
    streamRate: 25
    titleModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"

# Model specifications with user-friendly labels
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "pro"
      label: "Pro"
      description: "Best balance of speed and quality for most tasks"
      preset:
        endpoint: "bedrock"
        model: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
        maxContextTokens: 200000
        maxOutputTokens: 8192
    - name: "fast"
      label: "Fast"
      description: "Fastest responses for simple questions"
      preset:
        endpoint: "bedrock"
        model: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
        maxContextTokens: 200000
        maxOutputTokens: 8192
    - name: "thinking"
      label: "Thinking"
      description: "Deep reasoning for complex analysis"
      preset:
        endpoint: "bedrock"
        model: "us.anthropic.claude-opus-4-5-20251101-v1:0"
        maxContextTokens: 200000
        maxOutputTokens: 8192

# MCP Settings - allow internal Docker network domains
mcpSettings:
  allowedDomains:
    - "gateway"
    - "localhost"
    - "host.docker.internal"
    - "mcp.apog.ai"

# MCP Server Configuration
# Connects to Apogee MCP Gateway which provides all tools
# Uses MCP_GATEWAY_URL env var: http://gateway:3001 for local, https://mcp.apog.ai for production
mcpServers:
  apogee:
    type: streamable-http
    url: ${MCP_GATEWAY_URL:-http://gateway:3001}/mcp
    timeout: 60000
    initTimeout: 10000

# Registration settings
registration:
  socialLogins: []

# Interface customization
interface:
  privacyPolicy:
    externalUrl: "https://apog.ai/privacy"
  termsOfService:
    externalUrl: "https://apog.ai/terms"
  endpointsMenu: true
  modelSelect: false
  parameters: true
  sidePanel: true
  presets: false
  agents: false
  multiConvo: false
  webSearch: true

# Rate limiting (conservative defaults)
rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60
  conversationsImport:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60
